<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глаголица — Транслитератор</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a1410;
            color: #d4c5a9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #e8d5a3;
            text-align: center;
            margin-bottom: 0.3rem;
            letter-spacing: 0.05em;
        }

        .subtitle {
            font-size: 1rem;
            color: #8a7d6b;
            text-align: center;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .input-section {
            background: #2a2218;
            border: 1px solid #3d3428;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .input-section label {
            display: block;
            font-size: 0.9rem;
            color: #a89880;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            background: #1a1410;
            border: 1px solid #3d3428;
            border-radius: 4px;
            color: #d4c5a9;
            font-family: 'Georgia', serif;
            font-size: 1.2rem;
            padding: 1rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #6b5d45;
        }

        textarea::placeholder {
            color: #5a4f3f;
        }

        .detected-badge {
            display: inline-block;
            background: #3d3428;
            color: #a89880;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 3px;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .detected-badge.ru { color: #7ec8a0; background: #1a3a2a; }
        .detected-badge.en { color: #7eaac8; background: #1a2a3a; }
        .detected-badge.gl { color: #c8a87e; background: #3a2a1a; }

        .output-section {
            background: #2a2218;
            border: 1px solid #3d3428;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .output-section label {
            display: block;
            font-size: 0.9rem;
            color: #a89880;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .output {
            width: 100%;
            min-height: 60px;
            background: #1a1410;
            border: 1px solid #3d3428;
            border-radius: 4px;
            padding: 1rem;
            word-break: break-word;
            margin-bottom: 0.3rem;
        }

        .output:last-child { margin-bottom: 0; }

        .output-glag {
            color: #e8d5a3;
            font-size: 1.8rem;
            line-height: 2;
        }

        .output-cyrillic {
            color: #7ec8a0;
            font-size: 1.2rem;
        }

        .output-latin {
            color: #7eaac8;
            font-size: 1.2rem;
        }

        .output:empty::before {
            content: attr(data-placeholder);
            color: #3d3428;
        }

        .controls {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        button {
            background: #3d3428;
            color: #d4c5a9;
            border: 1px solid #5a4f3f;
            border-radius: 4px;
            padding: 0.6rem 1.2rem;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #5a4f3f;
            border-color: #8a7d6b;
        }

        .reference {
            background: #2a2218;
            border: 1px solid #3d3428;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .reference h2 {
            font-size: 1.1rem;
            color: #a89880;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .ref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 0.5rem;
        }

        .ref-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.6rem;
            background: #1a1410;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .ref-glag {
            font-size: 1.4rem;
            color: #e8d5a3;
            min-width: 2rem;
            text-align: center;
        }

        .ref-cyrillic { color: #7ec8a0; }
        .ref-latin { color: #6b5d45; font-size: 0.75rem; }

        .info {
            text-align: center;
            color: #5a4f3f;
            font-size: 0.8rem;
            margin-top: 2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Ⰰ Глаголица Ⱋ</h1>
    <p class="subtitle">Авто-транслитератор · Auto-transliterator</p>

    <div class="container">

        <div class="input-section">
            <label>Введите любой текст / Enter any text</label>
            <textarea id="input" placeholder="Пишите на русском, английском или глаголицей..."></textarea>
            <div id="detected" class="detected-badge" style="display:none"></div>
        </div>

        <div class="controls">
            <button onclick="copyAll()">📋 Копировать всё</button>
            <button onclick="clearAll()">✕ Очистить</button>
        </div>

        <div class="output-section">
            <label>Ⰰ Глаголица / Glagolitic</label>
            <div class="output output-glag" id="outGlag" data-placeholder="Ⰰ Ⰱ Ⰲ Ⰳ ..."></div>
        </div>

        <div class="output-section">
            <label>Кириллица / Cyrillic</label>
            <div class="output output-cyrillic" id="outCyrillic" data-placeholder="А Б В Г ..."></div>
        </div>

        <div class="output-section">
            <label>Латиница / Latin</label>
            <div class="output output-latin" id="outLatin" data-placeholder="A B V G ..."></div>
        </div>

        <div class="reference">
            <h2>Справочная таблица / Reference</h2>
            <div class="ref-grid" id="refGrid"></div>
        </div>

        <p class="info">Глаголица · IX век · Создана Кириллом и Мефодием</p>
    </div>

    <script>
        // === RUSSIAN CYRILLIC → GLAGOLITIC ===
        const ruToGlag = {
            'А': 'Ⰰ', 'Б': 'Ⱏ', 'В': 'Ⰱ', 'Г': 'Ⰲ', 'Д': 'Ⰳ',
            'Е': 'Ⰴ', 'Ё': 'Ⰴ', 'Ж': 'Ⰵ', 'З': 'Ⰶ', 'И': 'Ⰷ',
            'Й': 'Ⰸ', 'К': 'Ⰹ', 'Л': 'Ⰺ', 'М': 'Ⰻ', 'Н': 'Ⰼ',
            'О': 'Ⰽ', 'П': 'Ⰾ', 'Р': 'Ⰿ', 'С': 'Ⱀ', 'Т': 'Ⱁ',
            'У': 'Ⱂ', 'Ф': 'Ⱃ', 'Х': 'Ⱄ', 'Ц': 'Ⱅ', 'Ч': 'Ⱆ',
            'Ш': 'Ⱇ', 'Щ': 'Ⱈ', 'Ъ': 'Ⱉ', 'Ы': 'Ⰴ', 'Ь': 'Ⱊ',
            'Э': 'Ⰴ', 'Ю': 'Ⱌ', 'Я': 'Ⱍ', 'Ѣ': 'Ⱎ',
            'а': 'Ⱋ', 'б': 'Ⱐ', 'в': 'Ⰱ', 'г': 'Ⰲ', 'д': 'Ⰳ',
            'е': 'Ⰴ', 'ё': 'Ⰴ', 'ж': 'Ⰵ', 'з': 'Ⰶ', 'и': 'Ⰷ',
            'й': 'Ⰸ', 'к': 'Ⰹ', 'л': 'Ⰺ', 'м': 'Ⰻ', 'н': 'Ⰼ',
            'о': 'Ⰽ', 'п': 'Ⰾ', 'р': 'Ⰿ', 'с': 'Ⱀ', 'т': 'Ⱁ',
            'у': 'Ⱂ', 'ф': 'Ⱃ', 'х': 'Ⱄ', 'ц': 'Ⱅ', 'ч': 'Ⱆ',
            'ш': 'Ⱇ', 'щ': 'Ⱈ', 'ъ': 'Ⱉ', 'ы': 'Ⰴ', 'ь': 'Ⱊ',
            'э': 'Ⰴ', 'ю': 'Ⱌ', 'я': 'Ⱍ', 'ѣ': 'Ⱎ',
        };

        // === EXTENDED GLAGOLITIC (U+2C21–U+2C5F) → CYRILLIC ===
        const extendedGlagToRu = {
            // U+2C21 Sht
            'Ⱑ': 'Ѡ',
            // U+2C30 Yeri / Big Yus pair
            'ⰰ': 'Ѧ', 'ⰱ': 'Ѩ',
            // U+2C32–2C35 Yati, Little Yus, Big Yus (no lowercase for these)
            'ⰲ': 'Ѯ', 'ⰳ': 'Ѱ', 'ⰴ': 'Ѫ', 'ⰵ': 'Ѭ',
            // U+2C36–2C37 (reserved, skip)
            // U+2C3B Fita
            'ⰻ': 'Ѵ',
            // U+2C3D Izhitsa
            'ⰽ': 'І',
            // U+2C3E Tshe
            'ⰾ': 'Ѕ',
            // U+2C3F Chervena S
            'ⰿ': 'Ꙗ',
            // U+2C40–2C41 Omega, Epsilon
            'ⱀ': 'Ѡ', 'ⱁ': 'Ѥ',
            // U+2C42 (reserved)
            // U+2C43 Semi-Shti
            'ⱃ': 'Ꙉ',
            // U+2C44 (reserved)
            // U+2C45 Ksi
            'ⱅ': 'Ξ',
            // U+2C46 Psi
            'ⱆ': 'Ψ',
            // U+2C47 (reserved)
            // U+2C48 Omega (second form)
            'ⱈ': 'Ω',
            // U+2C49–2C4A (reserved)
            // U+2C4B Big Yuz
            'ⱋ': 'ꙮ',
            // U+2C4C–2C50 (reserved / other)
            // U+2C51 Koppa
            'ⱑ': '͸',
        };

        // === EXTENDED GLAGOLITIC → LATIN ===
        const extendedGlagToLat = {
            'Ⱑ': 'Ô',
            'ⰰ': 'Y', 'ⰱ': 'Ya',
            'ⰲ': 'X', 'ⰳ': 'Ps', 'ⰴ': 'U', 'ⰵ': 'Yu',
            'ⰻ': 'V',
            'ⰽ': 'I',
            'ⰾ': 'Dz',
            'ⰿ': 'Ŝ',
            'ⱀ': 'Ō', 'ⱁ': 'Ě',
            'ⱃ': 'Št',
            'ⱅ': 'X',
            'ⱆ': 'Ps',
            'ⱈ': 'Ō',
            'ⱋ': 'C',
            'ⱑ': 'K',
        };

        // === RUSSIAN CYRILLIC → LATIN (transliteration) ===
        const ruToLatin = {
            'А': 'A', 'Б': 'B', 'В': 'V', 'Г': 'G', 'Д': 'D',
            'Е': 'Ye', 'Ё': 'Yo', 'Ж': 'Zh', 'З': 'Z', 'И': 'I',
            'Й': 'Y', 'К': 'K', 'Л': 'L', 'М': 'M', 'Н': 'N',
            'О': 'O', 'П': 'P', 'Р': 'R', 'С': 'S', 'Т': 'T',
            'У': 'U', 'Ф': 'F', 'Х': 'Kh', 'Ц': 'Ts', 'Ч': 'Ch',
            'Ш': 'Sh', 'Щ': 'Sch', 'Ъ': "'", 'Ы': 'Y', 'Ь': '',
            'Э': 'E', 'Ю': 'Yu', 'Я': 'Ya',
            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
            'е': 'ye', 'ё': 'yo', 'ж': 'zh', 'з': 'z', 'и': 'i',
            'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
            'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
            'у': 'u', 'ф': 'f', 'х': 'kh', 'ц': 'ts', 'ч': 'ch',
            'ш': 'sh', 'щ': 'sch', 'ъ': "'", 'ы': 'y', 'ь': '',
            'э': 'e', 'ю': 'yu', 'я': 'ya',
            'Ѣ': 'Ě', 'ѣ': 'ě',
        };

        // === LATIN → GLAGOLITIC ===
        const latToGlag = {
            'A': 'Ⰰ', 'B': 'Ⱏ', 'C': 'Ⰹ', 'D': 'Ⰳ', 'E': 'Ⰴ',
            'F': 'Ⱃ', 'G': 'Ⰲ', 'H': 'Ⱄ', 'I': 'Ⰷ', 'J': 'Ⰸ',
            'K': 'Ⱓ', 'L': 'Ⰺ', 'M': 'Ⰻ', 'N': 'Ⰼ', 'O': 'Ⰽ',
            'P': 'Ⰾ', 'Q': 'Ⱔ', 'R': 'Ⰿ', 'S': 'Ⱀ', 'T': 'Ⱁ',
            'U': 'Ⱂ', 'V': 'Ⰱ', 'W': 'Ⱑ', 'X': 'Ⱕ', 'Y': 'Ⱒ',
            'Z': 'Ⰶ',
            'a': 'Ⱋ', 'b': 'Ⱐ', 'c': 'Ⰹ', 'd': 'Ⰳ', 'e': 'Ⰴ',
            'f': 'Ⱃ', 'g': 'Ⰲ', 'h': 'Ⱄ', 'i': 'Ⰷ', 'j': 'Ⰸ',
            'k': 'Ⱓ', 'l': 'Ⰺ', 'm': 'Ⰻ', 'n': 'Ⰼ', 'o': 'Ⰽ',
            'p': 'Ⰾ', 'q': 'Ⱔ', 'r': 'Ⰿ', 's': 'Ⱀ', 't': 'Ⱁ',
            'u': 'Ⱂ', 'v': 'Ⱖ', 'w': 'Ⱑ', 'x': 'Ⱕ', 'y': 'Ⱒ',
            'z': 'Ⰶ',
        };

        // === LATIN → CYRILLIC (reverse transliteration) ===
        const latToCyr = {
            'A': 'А', 'B': 'Б', 'C': 'К', 'D': 'Д', 'E': 'Е',
            'F': 'Ф', 'G': 'Г', 'H': 'Х', 'I': 'И', 'J': 'Й',
            'K': 'К', 'L': 'Л', 'M': 'М', 'N': 'Н', 'O': 'О',
            'P': 'П', 'Q': 'К', 'R': 'Р', 'S': 'С', 'T': 'Т',
            'U': 'У', 'V': 'В', 'W': 'В', 'X': 'Х', 'Y': 'Ы',
            'Z': 'З',
            'a': 'а', 'b': 'б', 'c': 'к', 'd': 'д', 'e': 'е',
            'f': 'ф', 'g': 'г', 'h': 'х', 'i': 'и', 'j': 'й',
            'k': 'к', 'l': 'л', 'm': 'м', 'n': 'н', 'o': 'о',
            'p': 'п', 'q': 'к', 'r': 'р', 's': 'с', 't': 'т',
            'u': 'у', 'v': 'в', 'w': 'в', 'x': 'х', 'y': 'ы',
            'z': 'з',
        };

        // === GLAGOLITIC → CYRILLIC (reverse) ===
        const glagToRu = {};
        for (const [cyr, glag] of Object.entries(ruToGlag)) {
            if (!glagToRu[glag]) glagToRu[glag] = cyr;
        }

        // === GLAGOLITIC → LATIN (reverse) ===
        const glagToLat = {};
        for (const [lat, glag] of Object.entries(latToGlag)) {
            if (!glagToLat[glag]) glagToLat[glag] = lat;
        }

        // Fix: uppercase А maps to same glag as lowercase в — prefer uppercase for reverse
        glagToRu['Ⰰ'] = 'А';
        glagToRu['Ⱋ'] = 'a';
        glagToRu['Ⰱ'] = 'В';
        glagToLat['Ⰰ'] = 'A';
        glagToLat['Ⱋ'] = 'a';
        glagToLat['Ⰱ'] = 'V';
        // Fix: lowercase v also maps to Ⰰ (collision with A) - prefer v for lowercase reverse
        glagToLat['Ⰰ'] = 'V';

        // Fix: chars only in ruToGlag need explicit glagToLat entries
        glagToLat['Ⰵ'] = 'Zh'; glagToLat['Ⱅ'] = 'Ts'; glagToLat['Ⱆ'] = 'Ch';
        glagToLat['Ⱇ'] = 'Sh'; glagToLat['Ⱈ'] = 'Sch'; glagToLat['Ⱉ'] = "'";
        glagToLat['Ⱊ'] = "'"; glagToLat['Ⱌ'] = 'Yu'; glagToLat['Ⱍ'] = 'Ya';
        glagToLat['Ⱎ'] = 'Ě';

        // Merge extended Glagolitic (U+2C21–U+2C5F) into reverse maps
        Object.assign(glagToRu, extendedGlagToRu);
        Object.assign(glagToLat, extendedGlagToLat);

        // Fix: extended Glagolitic chars used for Latin collisions (lowercase)
        // These must come after Object.assign to take precedence
        glagToLat['Ⱖ'] = 'v';
        glagToLat['Ⱏ'] = 'b';
        glagToLat['Ⱑ'] = 'w';
        glagToLat['Ⱒ'] = 'y';
        glagToLat['Ⱓ'] = 'k';
        glagToLat['Ⱔ'] = 'q';
        glagToLat['Ⱕ'] = 'x';

        // === DETECT LANGUAGE ===
        const GLAGOLITIC_RANGE = /^[\u2C00-\u2C5F]+$/;
        const CYRILLIC_RANGE = /[\u0400-\u04FF]/;
        const LATIN_RANGE    = /[a-zA-Z]/;

        function detectLang(text) {
            // Count characters in each range
            let glagCount = 0, cyrCount = 0, latCount = 0;
            for (const ch of text) {
                if (GLAGOLITIC_RANGE.test(ch)) glagCount++;
                else if (CYRILLIC_RANGE.test(ch)) cyrCount++;
                else if (LATIN_RANGE.test(ch)) latCount++;
            }

            if (glagCount > cyrCount && glagCount > latCount) return 'glagolitic';
            if (cyrCount > latCount) return 'russian';
            return 'english';
        }

        // === PUNCTUATION PASS-THROUGH ===
        const PASS_CHARS = new Set(' .,!?-;:()[]"\'/\n\t@#$%^&*+=<>{}|~`0123456789');

        // === TRANSLATE FUNCTIONS ===
        function toGlagolitic(text, fromLang) {
            const map = fromLang === 'russian' ? ruToGlag : latToGlag;
            return translate(text, map);
        }

        function toCyrillic(text, fromLang) {
            if (fromLang === 'glagolitic') return translate(text, glagToRu);
            if (fromLang === 'english') return translate(text, latToCyr);
            return text; // already cyrillic
        }

        function toLatin(text, fromLang) {
            if (fromLang === 'glagolitic') return translate(text, glagToLat);
            if (fromLang === 'russian') return translate(text, ruToLatin);
            return text; // already latin
        }

        function translate(text, map) {
            let result = '';
            for (const ch of text) {
                result += map[ch] !== undefined ? map[ch] : (PASS_CHARS.has(ch) ? ch : ch);
            }
            return result;
        }

        // === UI ===
        const badge = document.getElementById('detected');
        const outGlag = document.getElementById('outGlag');
        const outCyr = document.getElementById('outCyrillic');
        const outLat = document.getElementById('outLatin');

        function translateAll() {
            const input = document.getElementById('input').value;

            if (!input.trim()) {
                outGlag.textContent = '';
                outCyr.textContent = '';
                outLat.textContent = '';
                badge.style.display = 'none';
                return;
            }

            const lang = detectLang(input);

            // Show detected language badge
            badge.style.display = 'inline-block';
            badge.className = 'detected-badge';
            if (lang === 'russian') {
                badge.classList.add('ru');
                badge.textContent = '● Русский обнаружен';
            } else if (lang === 'english') {
                badge.classList.add('en');
                badge.textContent = '● English detected';
            } else {
                badge.classList.add('gl');
                badge.textContent = '● Глаголица обнаружена';
            }

            // Translate to all three scripts
            outGlag.textContent = toGlagolitic(input, lang);
            outCyr.textContent = toCyrillic(input, lang);
            outLat.textContent = toLatin(input, lang);
        }

        function copyAll() {
            const lines = [];
            if (outGlag.textContent) lines.push(outGlag.textContent);
            if (outCyr.textContent) lines.push(outCyr.textContent);
            if (outLat.textContent) lines.push(outLat.textContent);
            navigator.clipboard.writeText(lines.join('\n'));
        }

        function clearAll() {
            document.getElementById('input').value = '';
            translateAll();
        }

        // === REFERENCE TABLE ===
        const refData = [
            ['ⰀⰛ', 'А а', 'A'], ['ⰟⰠ', 'Б б', 'B'], ['Ⰱ', 'В в', 'V'],
            ['Ⰲ', 'Г г', 'G'], ['Ⰳ', 'Д д', 'D'], ['Ⰴ', 'Е е', 'E'],
            ['Ⰵ', 'Ж ж', 'Zh'], ['Ⰶ', 'З з', 'Z'], ['Ⰷ', 'И и', 'I'],
            ['Ⰸ', 'Й й', 'Y'], ['Ⰹ', 'К к', 'K'], ['Ⰺ', 'Л л', 'L'],
            ['Ⰻ', 'М м', 'M'], ['Ⰼ', 'Н н', 'N'], ['Ⰽ', 'О о', 'O'],
            ['Ⰾ', 'П п', 'P'], ['Ⰿ', 'Р р', 'R'], ['Ⱀ', 'С с', 'S'],
            ['Ⱁ', 'Т т', 'T'], ['Ⱂ', 'У у', 'U'], ['Ⱃ', 'Ф ф', 'F'],
            ['Ⱄ', 'Х х', 'Kh'], ['Ⱅ', 'Ц ц', 'Ts'], ['Ⱆ', 'Ч ч', 'Ch'],
            ['Ⱇ', 'Ш ш', 'Sh'], ['Ⱈ', 'Щ щ', 'Sch'], ['Ⱉ', 'Ъ', "'"],
            ['Ⱊ', 'Ь', "'"], ['Ⱌ', 'Ю ю', 'Yu'], ['Ⱍ', 'Я я', 'Ya'],
            ['Ⱎ', 'Ѣ ѣ', 'Ě'],
            // Extended Glagolitic (U+2C21–U+2C5F)
            ['Ⱑ', 'Ѡ', 'Ô'], ['ⰰ', 'Ѧ', 'Y'], ['ⰱ', 'Ѩ', 'Ya'],
            ['ⰲ', 'Ѯ', 'X'], ['ⰳ', 'Ѱ', 'Ps'], ['ⰴ', 'Ѫ', 'U'],
            ['ⰵ', 'Ѭ', 'Yu'], ['ⰻ', 'Ѵ', 'V'], ['ⰽ', 'І', 'I'],
            ['ⰾ', 'Ѕ', 'Dz'], ['ⰿ', 'Ꙗ', 'Ŝ'], ['ⱀ', 'Ѡ', 'Ō'],
            ['ⱁ', 'Ѥ', 'Ě'], ['ⱃ', 'Ꙉ', 'Št'], ['ⱅ', 'Ξ', 'X'],
            ['ⱆ', 'Ψ', 'Ps'], ['ⱈ', 'Ω', 'Ō'], ['ⱋ', 'ꙮ', 'C'],
            ['ⱑ', '͸', 'K'],
        ];

        function buildRef() {
            const grid = document.getElementById('refGrid');
            for (const [glag, cyr, lat] of refData) {
                const item = document.createElement('div');
                item.className = 'ref-item';
                item.innerHTML = `
                    <span class="ref-glag">${glag}</span>
                    <span>
                        <span class="ref-cyrillic">${cyr}</span>
                        <span class="ref-latin"> · ${lat}</span>
                    </span>
                `;
                grid.appendChild(item);
            }
        }

        // Live translation
        document.getElementById('input').addEventListener('input', translateAll);

        // Init
        buildRef();
    </script>

</body>
</html>
